<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 280" width="390" height="280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="40%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#0d0c0a"/>
    </linearGradient>
    <radialGradient id="beam" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#E8C547" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8C547" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="390" height="280" fill="url(#h)"/>
  <rect width="390" height="280" fill="url(#beam)"/>
  <!-- curtains -->
  <path d="M0 0 Q40 80 0 160 L0 0 Z" fill="#3a2018"/>
  <path d="M0 0 Q55 100 10 200 L0 220 L0 0 Z" fill="#2a1510" opacity="0.9"/>
  <path d="M390 0 Q350 80 390 160 L390 0 Z" fill="#3a2018"/>
  <path d="M390 0 Q335 100 380 200 L390 220 L390 0 Z" fill="#2a1510" opacity="0.9"/>
  <!-- notes -->
  <g fill="#C9A227" opacity="0.75">
    <circle cx="120" cy="150" r="10"/>
    <rect x="128" y="90" width="3" height="60"/>
    <circle cx="200" cy="130" r="8"/>
    <rect x="206" y="80" width="3" height="50"/>
    <path d="M260 100 Q280 90 300 110" fill="none" stroke="#C9A227" stroke-width="3"/>
  </g>
  <!-- bottom fade for photo overlap -->
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="50%" stop-color="#0d0c0a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0d0c0a" stop-opacity="0.95"/>
  </linearGradient>
  <rect width="390" height="280" fill="url(#fade)"/>
</svg>
