  <circle cx="80" cy="80" r="78" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>
  <!-- Chrome ring -->
  <circle cx="80" cy="80" r="72" fill="none" stroke="url(#chromeGrad)" stroke-width="8"/>
